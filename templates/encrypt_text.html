{% extends "base.html" %}

{% block title %}Text Encryption/Decryption - Quantum-Resistant PKI{% endblock %}

{% block content %}
<h1 class="page-title">Text Encryption/Decryption</h1>

<div style="max-width: 900px; margin: 0 auto;">
    <!-- Algorithm/Key Selection -->
    <div style="margin-bottom: 2rem;">
        <label class="form-label" for="keySelect">Select Key</label>
        <select class="form-select" id="keySelect">
            <option value="">Select a key...</option>
            <option value="kyber768">Kyber768 (Recommended)</option>
            <option value="kyber512">Kyber512</option>
        </select>
    </div>
    
    <!-- Public Key Path Input -->
    <div style="margin-bottom: 2rem;">
        <label class="form-label" for="publicKeyPath">Public Key File Path (for encryption)</label>
        <input type="text" class="form-control" id="publicKeyPath" placeholder="keys/public_key_20240101_120000.key">
    </div>
    
    <!-- Private Key Path Input -->
    <div style="margin-bottom: 2rem;">
        <label class="form-label" for="privateKeyPath">Private Key File Path (for decryption)</label>
        <input type="text" class="form-control" id="privateKeyPath" placeholder="keys/private_key_20240101_120000.key">
    </div>
    
    <!-- Input Text Area -->
    <div style="margin-bottom: 1rem;">
        <label class="form-label" for="inputText">Enter text to encrypt/decrypt</label>
        <textarea class="form-control" id="inputText" rows="8" placeholder="Enter text to encrypt/decrypt"></textarea>
    </div>
    
    <div style="color: var(--text-muted); margin-bottom: 2rem;">
        Character count: <span id="charCount">0</span>
    </div>
    
    <!-- Output Section -->
    <div style="margin-bottom: 1rem;">
        <h3 class="card-title" style="margin-bottom: 1rem;">Output</h3>
        <textarea class="form-control" id="outputText" rows="8" placeholder="Encrypted/decrypted text will appear here" readonly></textarea>
    </div>
    
    <div style="color: var(--text-muted); margin-bottom: 2rem;">
        Encryption time: <span id="encryptionTime">0.00s</span>
    </div>
    
    <!-- Action Buttons -->
    <div style="display: flex; gap: 1rem; justify-content: space-between;">
        <button class="btn btn-primary" id="encryptBtn">Encrypt</button>
        <button class="btn btn-secondary" id="decryptBtn">Decrypt</button>
        <button class="btn-link" id="clearBtn">Clear</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const inputText = document.getElementById('inputText');
const outputText = document.getElementById('outputText');
const charCount = document.getElementById('charCount');
const encryptionTime = document.getElementById('encryptionTime');
const encryptBtn = document.getElementById('encryptBtn');
const decryptBtn = document.getElementById('decryptBtn');
const clearBtn = document.getElementById('clearBtn');
const publicKeyPath = document.getElementById('publicKeyPath');
const privateKeyPath = document.getElementById('privateKeyPath');

// Character count
inputText.addEventListener('input', () => {
    charCount.textContent = inputText.value.length;
});

// Encrypt handler
encryptBtn.addEventListener('click', async () => {
    const text = inputText.value;
    const keyPath = publicKeyPath.value;
    
    if (!text) {
        alert('Please enter text to encrypt');
        return;
    }
    
    if (!keyPath) {
        alert('Please enter a public key path');
        return;
    }
    
    const startTime = performance.now();
    encryptBtn.disabled = true;
    
    try {
        const response = await fetch('/encrypt_text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: text,
                public_key_path: keyPath
            })
        });
        
        const result = await response.json();
        const endTime = performance.now();
        const timeTaken = ((endTime - startTime) / 1000).toFixed(2);
        
        if (result.success) {
            outputText.value = JSON.stringify(result.encrypted_data, null, 2);
            encryptionTime.textContent = timeTaken + 's';
        } else {
            alert('Error: ' + result.error);
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        encryptBtn.disabled = false;
    }
});

// Decrypt handler
decryptBtn.addEventListener('click', async () => {
    const encryptedData = inputText.value;
    const keyPath = privateKeyPath.value;
    
    if (!encryptedData) {
        alert('Please enter encrypted data to decrypt');
        return;
    }
    
    if (!keyPath) {
        alert('Please enter a private key path');
        return;
    }
    
    let parsedData;
    try {
        parsedData = JSON.parse(encryptedData);
    } catch (error) {
        alert('Invalid JSON format. Please enter valid encrypted data.');
        return;
    }
    
    const startTime = performance.now();
    decryptBtn.disabled = true;
    
    try {
        const response = await fetch('/decrypt_text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                encrypted_data: parsedData,
                private_key_path: keyPath
            })
        });
        
        const result = await response.json();
        const endTime = performance.now();
        const timeTaken = ((endTime - startTime) / 1000).toFixed(2);
        
        if (result.success) {
            outputText.value = result.plaintext;
            encryptionTime.textContent = timeTaken + 's';
        } else {
            alert('Error: ' + result.error);
        }
    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        decryptBtn.disabled = false;
    }
});

// Clear handler
clearBtn.addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    charCount.textContent = '0';
    encryptionTime.textContent = '0.00s';
});
</script>
{% endblock %}
